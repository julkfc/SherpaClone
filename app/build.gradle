plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.voicecloner'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.voicecloner"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
    
    // 解决中文路径问题 + sherpa-onnx .so 文件不压缩
    aaptOptions {
        cruncherEnabled = false
        noCompress 'onnx'
    }
}

dependencies {
    // ========== sherpa-onnx Java API 已通过源码方式包含 ==========
    // 原生 .so 库在 src/main/jniLibs/

    // ========== AndroidX ==========
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'

    // ========== 工具库 ==========
    implementation 'com.google.code.gson:gson:2.10.1'     // JSON 解析
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'   // 网络下载
}
